[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "living-library"
version = "0.1.0"
description = "A local, model-agnostic memory store for AI conversations"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110,<0.116",
    "uvicorn>=0.29,<0.31",
    "pydantic>=2.7,<3",
    "sentence-transformers>=3.0,<4",
    "mcp>=1.0,<2",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5,<1",
    "pytest>=8.2,<9",
]

[project.scripts]
living-library = "living_library.cli:main"
akashic-codex = "akashic_codex.cli:main"

[tool.setuptools.package-data]
living_library = ["schema.sql", "store.html"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = []

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]
[tool.ruff.format]
quote-style = "single"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:akashic_codex.*",
    "ignore::DeprecationWarning:living_library.*",
]
