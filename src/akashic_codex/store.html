<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AkashicCodex</title>
    <style>
      :root { color-scheme: light dark; font: 16px system-ui, sans-serif; }
      body { max-width: 900px; margin: 3rem auto; padding: 0 1rem; }
      h1 { margin-bottom: .2rem; }
      p { color: color-mix(in srgb, currentColor 65%, transparent); }
      form { display: flex; gap: .5rem; margin: 2rem 0 1rem; }
      input { flex: 1; padding: .7rem; font: inherit; }
      button { padding: .6rem .9rem; font: inherit; cursor: pointer; }
      article { border-top: 1px solid #8886; padding: 1rem 0; }
      article button { border: 0; background: none; padding: 0; text-align: left; color: inherit; }
      article h2 { font-size: 1.15rem; margin: 0; }
      .meta { font-size: .85rem; margin: .3rem 0; }
      .summary { margin: .4rem 0; }
      pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #8882;
        border-radius: .5rem; }
      #status { min-height: 1.5em; }
      #conversation { border-top: 1px solid #8886; margin-top: 2rem; padding-top: 1rem; }
    </style>
  </head>
  <body>
    <h1>AkashicCodex</h1>
    <p>Browse recent memories or search by meaning and keywords.</p>
    <form id="search">
      <input id="query" type="search" placeholder="Search conversations"
        aria-label="Search conversations">
      <button>Search</button>
    </form>
    <button id="browse" type="button">Browse all</button>
    <p id="status" role="status"></p>
    <section id="results" aria-label="Conversations"></section>
    <section id="conversation" hidden>
      <h2 id="conversation-title"></h2>
      <p id="conversation-meta" class="meta"></p>
      <pre id="transcript"></pre>
    </section>
    <script>
      const results = document.querySelector("#results");
      const status = document.querySelector("#status");
      const conversation = document.querySelector("#conversation");

      function showResults(rows) {
        results.replaceChildren();
        conversation.hidden = true;
        status.textContent = rows.length ? `${rows.length} conversation(s)` : "No conversations found.";
        for (const row of rows) {
          const article = document.createElement("article");
          const open = document.createElement("button");
          const title = document.createElement("h2");
          const meta = document.createElement("p");
          const summary = document.createElement("p");
          open.type = "button";
          title.textContent = row.title;
          meta.className = "meta";
          meta.textContent = [row.source, row.created_at].filter(Boolean).join(" · ");
          summary.className = "summary";
          summary.textContent = row.summary || "";
          open.append(title);
          open.addEventListener("click", () => openConversation(row.id));
          article.append(open, meta, summary);
          results.append(article);
        }
      }

      async function loadRows(url) {
        status.textContent = "Loading…";
        try {
          const response = await fetch(url);
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          showResults(await response.json());
        } catch (error) {
          status.textContent = error.message;
        }
      }

      async function openConversation(id) {
        status.textContent = "Loading conversation…";
        try {
          const response = await fetch(`/conversations/${id}`);
          if (!response.ok) throw new Error(`Request failed (${response.status})`);
          const row = await response.json();
          document.querySelector("#conversation-title").textContent = row.title;
          document.querySelector("#conversation-meta").textContent =
            `${row.source || "unknown source"} · ${row.created_at}`;
          document.querySelector("#transcript").textContent = row.full_log;
          conversation.hidden = false;
          status.textContent = "";
        } catch (error) {
          status.textContent = error.message;
        }
      }

      document.querySelector("#browse").addEventListener("click", () => {
        loadRows("/conversations?limit=100");
      });
      document.querySelector("#search").addEventListener("submit", event => {
        event.preventDefault();
        const query = document.querySelector("#query").value.trim();
        if (query) loadRows(`/search?query=${encodeURIComponent(query)}&limit=100`);
      });

      loadRows("/conversations");
    </script>
  </body>
</html>
